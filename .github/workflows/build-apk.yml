name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Write access is only needed to attach the APK to a tag's GitHub Release.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # AGP 8.13 requires JDK 17+ and Gradle 8.13 (see gradle/wrapper).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # compileSdk 36, default build-tools 35.0.0 for AGP 8.13.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      # Caches the Gradle distribution downloaded by the wrapper plus build caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The debug variant is signed with the auto-generated debug keystore,
      # so no signing secrets are required or referenced here.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
